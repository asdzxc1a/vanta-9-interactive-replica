<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b23" />
  <title>Interactive Wolf — Three.js</title>
  <style>
    :root{color-scheme:dark;--bg:#070b23}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{user-select:none;-webkit-user-select:none;overscroll-behavior:none}#viewer{position:fixed;inset:0;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none}#viewer.dragging{cursor:grabbing}#fallback,#webgl,#webgl canvas{position:absolute;inset:0;width:100%;height:100%}#fallback{display:block;object-fit:contain;opacity:1;pointer-events:none;transform-origin:50% 50%;will-change:transform,filter;transition:opacity .14s ease}#webgl{opacity:0;pointer-events:none;transition:opacity .14s ease}body.webgl-active #webgl{opacity:1}body.webgl-active #fallback{opacity:0}.ui{position:fixed;z-index:10;display:flex;gap:8px;align-items:center;padding:8px 11px;border-radius:999px;background:rgba(4,7,24,.62);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:12px;font-weight:650;line-height:1;box-shadow:0 8px 30px rgba(0,0,0,.22)}#hint{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));pointer-events:none}#reset{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));cursor:pointer;appearance:none}#reset:hover{background:rgba(30,40,80,.84)}#loading{left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .18s ease}#loading.done{opacity:0}#status{top:14px;left:14px;display:none}body.debug #status{display:flex}@media(max-width:600px){#hint{font-size:11px;padding:7px 9px}}
  </style>
</head>
<body>
  <main id="viewer" aria-label="Interactive Three.js wolf character">
    <img id="fallback" alt="Stylized wolf character" draggable="false" />
    <div id="webgl" aria-hidden="true"></div>
  </main>
  <div id="loading" class="ui">Loading character…</div>
  <div id="hint" class="ui">Drag • Move pointer • Scroll</div>
  <button id="reset" class="ui" type="button">Reset</button>
  <div id="status" class="ui">Starting…</div>
  <script src="./mini.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
