<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b23" />
  <title>Interactive Wolf — Three.js</title>
  <style>
    :root{color-scheme:dark;--bg:#070b23}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif}body{user-select:none;-webkit-user-select:none;overscroll-behavior:none}#viewer{position:fixed;inset:0;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none}#viewer.dragging{cursor:grabbing}#fallback,#webgl,#webgl canvas{position:absolute;inset:0;width:100%;height:100%}#fallback{display:block;object-fit:contain;pointer-events:none;transform-origin:50% 50%;will-change:transform,filter;transition:opacity .18s ease}#webgl{opacity:0;pointer-events:none;transition:opacity .18s ease}body.webgl-ready #webgl{opacity:1}body.webgl-ready #fallback{opacity:0}.ui{position:fixed;z-index:10;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:999px;background:rgba(4,7,24,.58);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);color:#fff;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.2)}#hint{left:14px;bottom:14px;pointer-events:none}#reset{right:14px;bottom:14px;cursor:pointer;appearance:none}#reset:hover{background:rgba(30,40,80,.8)}#loading{left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}@media(max-width:600px){#hint{font-size:11px}}
  </style>
</head>
<body>
  <main id="viewer" aria-label="Interactive Three.js wolf character">
    <img id="fallback" alt="Stylized wolf character" draggable="false" />
    <div id="webgl"></div>
  </main>
  <div id="loading" class="ui">Loading character…</div>
  <div id="hint" class="ui">Drag • Move pointer • Scroll</div>
  <button id="reset" class="ui">Reset</button>
  <script src="./ref-0.js"></script><script src="./ref-1.js"></script><script src="./ref-2.js"></script><script src="./ref-3.js"></script><script src="./ref-4.js"></script><script src="./ref-5.js"></script><script src="./ref-6.js"></script><script src="./depth-0.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
